_target_: lever_lm.models.gpt2_lever_lm.GPT2LeverLM
# index_ds_size, embedding_lookup 由 main() 在运行时传入
lm_config:
  n_embd: 512
  n_head: 8
  n_layer: 2
# GPT2 dropout，默认 0.1；增大可缓解过拟合
attn_pdrop: 0.3
resid_pdrop: 0.3
embd_pdrop: 0.3
input_dim: 2560
adapter: true
norm: false
freeze_prefix_list: null
query_encoding_flag: null
icd_encoding_flag: null
