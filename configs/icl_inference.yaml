# 阶段2：ICL推理配置
defaults:
  - task/mmlu
  - dataset/mmlu
  - infer_model/llada
  - train: base_experiment  # 用于 LeverLM 模型结构（lever_lm, lever_lm_ds）

# Retriever 配置
retriever:
  type: rand  # rand | lever_lm
  nshot: 3
  seed: 42

# Query 位置
#这里是暂时的,正常的分类起就是放在前面的
query_position: 0  # 0=最后，nshot=最前

# LeverLM 配置（当 retriever.type=lever_lm 时使用）
#这里我先临时使用
lever_lm:
  ckpt_dir: "generated_icd_data/model_cpk/mmlu/debug"
  ckpt_path: "generated_icd_data/model_cpk/mmlu/debug/min_vl-epoch=0-train_loss=6.68746-val_loss=7.14538.ckpt"  # 若指定则优先使用；否则从 ckpt_dir 按 default_cpk_key 查找
  default_cpk_key: "min_vl"  # min_vl | min_tl | last
  embedding_path: "generated_icd_data/cache/mmlu/mmlu-mmlu-Qwen3-Embedding-4B-TextFeatures.pt"
  qwen_model_path: "/home/lzh/.cache/modelscope/hub/models/Qwen/Qwen3-Embedding-4B"
  device: "cuda:1"
  batch_size: 32
  reverse_seq: false  # 是否反转生成的 ICD 序列顺序
  debug: true
  debug_prefix_chars: 200

# 这里暂定200
output_dir: "./generated_icd_data/icl_inference_results"
max_samples: 3  # 限制测试样本数（null=全部）

# 可选：自定义测试子集（例如 generated_icd_data/cache/test_200.json）
test_subset_ids_path: null

# Debug helpers (disabled by default)
debug:
  print_prompt: true
  prompt_max_chars: 4000
