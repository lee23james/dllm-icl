# SST-2 情感分类（正/负）
task_name: "sst2"
split_token: "\n\n"

# label 数字 -> 文本含义（供 PPL / prompt 使用）
label_mapping:
  "0": "negative"
  "1": "positive"

# 复用 subj 的 prompt 模板："Input: <S>\nType: <A>"
template: ${infer_model.prompt_templates.subj_prompt_template}

column_token_map:
  sentence: "<S>"   # 句子文本
  answer: "<A>"     # 情感标签文本（negative/positive）

input_columns: ["sentence"]
output_column: "answer"

# 哪一列要被 mask 掉（用于 mask-based ICL）
mask_column_token_map: "answer"

gen_args:
  gen_length: 2
  steps: 2
  block_length: 2
  mask_length: 2
  mc_num: 1

