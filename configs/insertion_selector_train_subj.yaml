# InsertionSelector 训练配置（Subj）
# 训练集 = generated_data JSON（subj）；题库 jsonl 与预计算 .pt 对应
# 先运行: python generate_data_main.py task=subj dataset=subj
# 再将下方 json_path 改为实际生成的文件路径

data:
  json_path: "generated_icd_data/generated_data/subj-subj-llada-random_sampler-scorer_infoscore-construct_order_no_order-beam_size_5-few_shot_3-candidate_num_64-sample_num_5000-mc_num_1.json"
  train_path: "data/subj/train.jsonl"
  label_mapping: {'0': 'subjective', '1': 'objective'}
  val_ratio: 0.2
  val_split_seed: 42

embedding:
  embedding_cache_path: "generated_icd_data/embedding_cache/subj-subj-Qwen3-Embedding-4B-TextFeatures.pt"
  qwen_model_path: "/home/lzh/.cache/modelscope/hub/models/Qwen/Qwen3-Embedding-4B"
  emb_dim: 2560

model:
  emb_dim: 2560
  n_head: 16
  dropout: 0.2

training:
  batch_size: 32
  max_epochs: 20
  lr: 1e-4
  weight_decay: 5.0e-2
  warm_steps: 0.1
  loss_weight_by_score: false
  gpu_ids: [1,2,3]

output:
  checkpoint_dir: "generated_icd_data/checkpoints/insertion_selector_subj"
  save_top_k: 2
